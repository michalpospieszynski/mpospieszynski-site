<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>mpospieszynski.pl</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Theme before the first paint (core/theme/theme.service.ts): the stored choice, else the system preference.
       The SSR server puts its CSP nonce on this script (server-security.ts, addNonce). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
