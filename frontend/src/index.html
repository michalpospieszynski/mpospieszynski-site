<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>mpospieszynski.pl</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The header's graph mark (public/favicon.svg); the .ico (16/32/48) and the touch icon are rendered from it. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- The bare home address follows the visitor's explicit language choice (LanguageService.rememberLang, the
       pill or the language hint). Only `/`, never deep links, and only after a choice, so crawlers always get Polish. -->
  <script>
    (function () {
      try {
        if (location.pathname === '/' && localStorage.getItem('lang') === 'en') {
          location.replace('/en' + location.search + location.hash);
        }
      } catch (e) {}
    })();
  </script>
  <!-- Theme before the first paint (core/theme/theme.service.ts): the stored choice, else the system preference.
       The SSR server puts its CSP nonce on this script (server-security.ts, addNonce). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
