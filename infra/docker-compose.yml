# Production stack on the VPS (docs/ARCHITECTURE.md §3, docs/IMPLEMENTATION-PLAN.md I2): three containers, no
# database (PostgreSQL, Auth and Storage are Supabase), no published host ports. Cloudflare Tunnel is the only
# way in; its ingress rules (cloudflared/config.yml) route /api, /media, /sitemap.xml and /robots.txt to the API.
#
#   cd /opt/site && ./deploy.sh <git-sha>      (the deploy workflow does this; ./deploy.sh --previous rolls back)
#
# Values are interpolated from .env next to this file (`gha` user, mode 600, from .env.example: REGISTRY and every
# secret) and from release.env (TAG only, written by deploy.sh). Manual commands pass both:
#   docker compose --env-file .env --env-file release.env ps
# Each service gets only the variables it needs.

name: site

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  cloudflared:
    <<: *defaults
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run ${TUNNEL_ID:?set TUNNEL_ID in .env}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Created by `cloudflared tunnel create`; lives only on the VPS (chown 65532, chmod 400), never in git.
      - ${TUNNEL_CREDENTIALS_FILE:-./cloudflared/credentials.json}:/etc/cloudflared/credentials.json:ro
    mem_limit: 128m
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    <<: *defaults
    image: ${REGISTRY:?set REGISTRY in .env}/site-web:${TAG:?set TAG in release.env (deploy.sh)}
    build: ../frontend
    environment:
      API_INTERNAL_URL: http://api:8080
      # Angular SSR answers only known hosts (angular.json allowedHosts); add a test hostname here if you use one.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-}
      SITE_BASE_URL: ${SITE_BASE_URL:?}
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
      # PostHog project key (docs/ANALYTICS.md); empty = analytics off (no banner, no /ingest proxy).
      POSTHOG_KEY: ${POSTHOG_KEY:-}
    mem_limit: 512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *defaults
    image: ${REGISTRY:?}/site-api:${TAG:?}
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SITE_BASE_URL: ${SITE_BASE_URL:?}
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:?}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-media}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      MAIL_HOST: ${MAIL_HOST:?}
      MAIL_PORT: ${MAIL_PORT:?}
      MAIL_USERNAME: ${MAIL_USERNAME:?}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?}
      MAIL_FROM: ${MAIL_FROM:?}
      MAIL_OWNER_TO: ${MAIL_OWNER_TO:?}
      IP_HASH_SALT: ${IP_HASH_SALT:?}
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
